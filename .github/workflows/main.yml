name: Build and Release

on:
  push:
    # Trigger the workflow only when a new tag is pushed (e.g., v1.0)
    tags:
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch: # Allows manual running

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64, arm]

        exclude:
          - os: windows
            arch: arm
          - os: darwin
            arch: arm

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 🏗️ Build CLI App
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arch == 'arm' && 7 || '' }}
          
        run: |
          if [ "${{ matrix.arch }}" = "arm" ]; then
            OUTPUT_ARCH_NAME="armv7"
          else
            OUTPUT_ARCH_NAME="${{ matrix.arch }}"
          fi
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUTPUT_NAME="auto-suspend_${{ matrix.os }}_${{ matrix.arch }}.exe"
          else
            OUTPUT_NAME="auto-suspend_${{ matrix.os }}_${{ matrix.arch }}"
          fi

          go build -o dist/$OUTPUT_NAME .
          
      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-suspend-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    name: 📝 Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    
    # Only run the release job if the workflow was triggered by a tag push
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: ⬇️ Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: 🔎 Verify Downloaded Files
        run: ls -R dist/

      - name: 🚀 Create Draft Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            # ${{ github.ref_name }}

            This is a draft release with binaries for multiple platforms/architectures.
          files: dist/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
